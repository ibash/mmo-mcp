[project]
name = "mmo-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Islam Sharabash", email = "islam.sharabash@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastmcp",
    "psycopg[binary]>=3.2.9",
    "pydantic>=2.11.7",
    "pydantic-ai-slim[anthropic,openai]>=0.7.4",
    "pydantic-settings>=2.10.1",
    "uvicorn[standard]>=0.35.0",
]

[project.scripts]
mmo-server = "mmo.server:main"
mmo-cli = "mmo.cli:main"


[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

#[build-system]
#requires = ["hatchling"]
#build-backend = "hatchling.build"

[tool.setuptools.packages.find]
include = ["mmo*"]

[tool.uv.sources]
fastmcp = { git = "https://github.com/ibash/fastmcp.git" }


[dependency-groups]
dev = [
    "pyright>=1.1.404",
    "ruff>=0.12.10",
]
